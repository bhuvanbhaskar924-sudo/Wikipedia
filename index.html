<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OpenPedia</title>

    <meta name="description"
          content="OpenPedia - fictional encyclopedia">

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- =========================
         TOP HEADER
    ========================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                W
            </div>

            <div>

                <div class="brand-name">
                    OpenPedia
                </div>

                <div class="brand-sub">
                    The free encyclopedia
                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <form id="searchForm"
              class="search">

            <input
                id="searchInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search OpenPedia"
                aria-label="Search OpenPedia"
            >

            <button type="submit">
                Search
            </button>

        </form>

    </header>



    <!-- =========================
         MAIN LAYOUT
    ========================== -->

    <main class="layout">


        <!-- =====================
             LEFT SIDEBAR
        ====================== -->

        <aside class="sidebar">

            <button
                id="homeBtn"
                class="side-link">
                Main page
            </button>


            <button
                id="randomBtn"
                class="side-link">
                Random article
            </button>


            <div class="side-title">
                Navigation
            </div>


            <div class="side-note">

                Browse articles and
                follow links to explore
                related topics.

            </div>


            <div
                id="status"
                class="status">

                Ready

            </div>

        </aside>



        <!-- =====================
             ARTICLE AREA
        ====================== -->

        <section class="content">


            <!-- SEARCH MESSAGE -->

            <div
                id="searchNotice"
                class="notice hidden">
            </div>


            <!-- ARTICLE -->

            <article
                id="article">
            </article>


            <!-- =================
                 BROWSING TRAIL
            ================== -->

            <section
                id="trailBox"
                class="trail-box hidden">

                <div class="trail-title">
                    Your browsing trail
                </div>


                <div id="trail">
                </div>

            </section>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <span>
            OpenPedia —
            fictional demo encyclopedia
        </span>

        <span id="footerYear">
        </span>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>

</html>
