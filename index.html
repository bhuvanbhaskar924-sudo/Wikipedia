<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- HOMEPAGE -->
        <div id="homepage" class="page active">
            <div class="header">
                <div class="header-left">
                    <button class="hamburger">☰</button>
                    <span class="logo">Wikipedia</span>
                </div>
                <div class="header-right">
                    <button class="search-btn" onclick="goToSearch()">🔍</button>
                </div>
            </div>

            <div class="homepage-content">
                <div class="wiki-logo-section">
                    <div class="logo-text">Wikipedia</div>
                    <div class="tagline">The Free Encyclopedia</div>
                </div>

                <div class="search-box-container">
                    <input type="text" id="homeSearch" placeholder="Search Wikipedia" class="search-input">
                    <button onclick="searchFromHome()" class="search-button">Search</button>
                </div>

                <div class="featured-section">
                    <h3>Featured Today</h3>
                    <div id="featuredList" class="featured-articles"></div>
                </div>
            </div>
        </div>

        <!-- SEARCH PAGE -->
        <div id="searchpage" class="page">
            <div class="header">
                <div class="header-left">
                    <button class="back-btn" onclick="goBack()">← Back</button>
                </div>
                <div class="header-right">
                    <span class="search-icon">🔍</span>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search Wikipedia..." class="search-box" autofocus>
            </div>

            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- ARTICLE PAGE -->
        <div id="articlepage" class="page">
            <div class="header">
                <div class="header-left">
                    <button class="back-btn" onclick="goBack()">← Back</button>
                </div>
                <div class="header-right">
                    <button class="search-btn" onclick="goToSearch()">🔍</button>
                </div>
            </div>

            <div class="article-container">
                <div id="articleContent" class="article-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
